        run: |
          work_root="$RUNNER_TEMP/anland-niri-fedora-43"
          work_dir="$work_root/work"
          packages_dir="$work_root/packages"
          publish_dir="$GITHUB_WORKSPACE/build-artifacts/niri/fedora-43"
          mkdir -p "$work_dir" "$packages_dir" "$publish_dir"
          chown -R builder "$GITHUB_WORKSPACE" "$work_root"
          short_hash=$(sudo -u builder -H git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)
          release_suffix="$short_hash"_"fedora43_aarch64"
          echo "BUILD_WORK_DIR=$work_dir" >> "$GITHUB_ENV"
          echo "BUILD_PACKAGES_DIR=$packages_dir" >> "$GITHUB_ENV"
          echo "BUILD_PUBLISH_DIR=$publish_dir" >> "$GITHUB_ENV"
          echo "BUILD_RELEASE_NAME_SUFFIX=$release_suffix" >> "$GITHUB_ENV"

      - name: Build Niri packages
        shell: bash
        run: |
          sudo -u builder -H env \
            WORKDIR="$BUILD_WORK_DIR" \
            ARTIFACTS_DIR="$BUILD_PACKAGES_DIR" \
            ARTIFACTS="$BUILD_PACKAGES_DIR" \
            ANLAND_WITH_DEPS=1 \
            ANLAND_INSTALL=0 \
            JOBS=4 \
            bash "$GITHUB_WORKSPACE/producers/niri/Fedora43_v5/build.sh"

      - name: Collect RPM packages and checksums
        shell: bash
        run: |
          artifact_dir="$BUILD_PUBLISH_DIR"
          mkdir -p "$artifact_dir"
          found=0
          while IFS= read -r -d '' package; do
            cp -- "$package" "$artifact_dir/"
            found=1
          done < <(
            for candidate in "$BUILD_PACKAGES_DIR" "$GITHUB_WORKSPACE/producers/niri/Fedora43_v5/artifacts"; do
              if [[ -d "$candidate" ]]; then
                find "$candidate" -type f -name '*.rpm' ! -name '*.src.rpm' ! -name '*debug*' -print0
              fi
            done | sort -zu
          )
          if [[ "$found" != 1 ]]; then
            echo "No Fedora RPM packages were produced for niri/fedora-43" >&2
            exit 1
          fi
          for candidate in "$BUILD_PACKAGES_DIR" "$BUILD_WORK_DIR"; do
            for metadata in packages.list build-inputs.json; do
              if [[ -f "$candidate/$metadata" && ! -e "$artifact_dir/$metadata" ]]; then
                cp -- "$candidate/$metadata" "$artifact_dir/"
              fi
            done
          done
          (
            cd "$artifact_dir"
            sha256sum -- ./*.rpm > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          cat "$artifact_dir/SHA256SUMS"

      - name: Upload Fedora packages
        uses: actions/upload-artifact@v7
        with:
          name: niri_${{ env.BUILD_RELEASE_NAME_SUFFIX }}
          path: build-artifacts/niri/fedora-43
          if-no-files-found: error
          retention-days: 90

